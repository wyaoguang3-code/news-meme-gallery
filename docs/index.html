<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版本更新 · 每日新聞梗圖庫</title>
<style>
  :root {
    --bg: #f6f7f8; --card: #ffffff; --text: #1c1e21; --muted: #65676b;
    --chip: #e4e6e9; --chip-on: #1c1e21; --chip-on-text: #ffffff;
    --ok: #2e9e5b; --no: #d64545; --pending: #b58a2c; --shadow: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1d2024; --text: #e8eaed; --muted: #9aa0a6;
      --chip: #2a2e33; --chip-on: #e8eaed; --chip-on-text: #121417;
      --shadow: rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg);
           padding: 14px 18px 10px; border-bottom: 1px solid var(--chip); }
  h1 { font-size: 19px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  #userBar { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  #userBar button { border: 1px solid var(--chip); background: transparent; color: var(--text);
                    border-radius: 8px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chips span.label { color: var(--muted); font-size: 12px; align-self: center; margin-right: 2px; }
  .chip { border: 0; cursor: pointer; background: var(--chip); color: var(--text);
          border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  main { padding: 16px; }
  .wall { column-width: 250px; column-gap: 14px; max-width: 1400px; margin: 0 auto; }
  .pin { break-inside: avoid; margin: 0 0 14px; background: var(--card);
         border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px var(--shadow);
         cursor: zoom-in; transition: transform .12s ease; }
  .pin:hover { transform: translateY(-2px); }
  .pin img { width: 100%; display: block; }
  .meta { padding: 9px 11px 11px; }
  .meta .topic { font-size: 13px; line-height: 1.45; }
  .meta .sub { display: flex; gap: 6px; align-items: center; margin-top: 7px;
               font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .badge { border-radius: 6px; padding: 1px 7px; font-size: 11px; color: #fff; }
  .badge.approved { background: var(--ok); }
  .badge.rejected { background: var(--no); }
  .badge.pending  { background: var(--pending); }
  .cat { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .vote { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .vote button { border: 1px solid var(--chip); background: transparent; color: var(--text);
                 border-radius: 8px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .vote button.my { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  .vote .n { font-size: 11px; color: var(--muted); }
  /* lightbox */
  #box { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none;
         z-index: 50; align-items: center; justify-content: center; padding: 24px; }
  #box.show { display: flex; }
  #box .panel { background: var(--card); border-radius: 16px; max-width: 900px;
                width: 100%; max-height: 92vh; overflow: auto;
                display: grid; grid-template-columns: minmax(0,1.1fr) minmax(240px,.9fr); }
  #box img { width: 100%; display: block; }
  #box .info { padding: 18px; }
  #box .info h2 { font-size: 16px; line-height: 1.5; margin-bottom: 10px; }
  #box .info pre { font: 14px/1.8 inherit; white-space: pre-wrap; background: var(--chip);
                   border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  #box .info .row { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #box .info a { color: inherit; }
  @media (max-width: 640px) { #box .panel { grid-template-columns: 1fr; } }
  /* auth wall */
  #gate { position: fixed; inset: 0; background: var(--bg); z-index: 100;
          display: flex; align-items: center; justify-content: center; padding: 20px; }
  #gate.hidden { display: none; }
  #gate .card { background: var(--card); border-radius: 16px; box-shadow: 0 4px 24px var(--shadow);
                width: 100%; max-width: 380px; padding: 26px; }
  #gate h2 { font-size: 18px; margin-bottom: 4px; }
  #gate .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .auth-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .auth-tab { flex: 1; border: 1px solid var(--chip); background: transparent; color: var(--text);
              border-radius: 8px; padding: 7px 0; cursor: pointer; font-size: 14px; }
  .auth-tab.active { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  #gate label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  #gate input { width: 100%; padding: 9px 10px; border: 1px solid var(--chip); border-radius: 8px;
                background: transparent; color: var(--text); font-size: 14px; }
  #gate .err { color: var(--no); font-size: 13px; min-height: 18px; margin-top: 8px; }
  #gate .note { color: var(--ok); font-size: 13px; min-height: 0; margin-top: 4px; }
  #gate .go { width: 100%; margin-top: 14px; padding: 10px 0; border: 0; border-radius: 9px;
              background: var(--chip-on); color: var(--chip-on-text); font-size: 15px; cursor: pointer; }
  #gate .alt { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
  #gate .alt button { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; }
  /* 批次審核 */
  #rv { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none;
        z-index: 60; align-items: center; justify-content: center; padding: 18px; }
  #rv.show { display: flex; }
  #rv .rv-panel { background: var(--bg); border-radius: 16px; width: 100%; max-width: 780px;
                  max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
  #rv header.rv-h { position: static; display: flex; align-items: center; gap: 10px;
                    padding: 14px 18px; border-bottom: 1px solid var(--chip); }
  #rv header.rv-h b { font-size: 16px; }
  #rv header.rv-h span { color: var(--muted); font-size: 12px; }
  #rv .rv-list { overflow-y: auto; padding: 6px 14px; }
  .rv-row { display: grid; grid-template-columns: 76px 1fr; gap: 12px;
            padding: 12px 4px; border-bottom: 1px solid var(--chip); }
  .rv-row img { width: 76px; border-radius: 8px; display: block; cursor: zoom-in; }
  .rv-row .t { font-size: 13px; line-height: 1.4; }
  .rv-row .t small { color: var(--muted); }
  .rv-c { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .rv-c button { border: 1px solid var(--chip); background: transparent; color: var(--text);
                 border-radius: 8px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .rv-c button.sel-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .rv-c button.sel-no { background: var(--no); border-color: var(--no); color: #fff; }
  .rv-c input { flex: 1; min-width: 150px; padding: 5px 9px; border: 1px solid var(--chip);
                border-radius: 8px; background: transparent; color: var(--text); font-size: 13px; }
  #rv footer { padding: 12px 18px; border-top: 1px solid var(--chip);
               display: flex; gap: 10px; align-items: center; }
  #rv footer .cnt { color: var(--muted); font-size: 13px; flex: 1; }
  #rv footer button { border: 0; border-radius: 9px; padding: 9px 18px; font-size: 14px;
                      cursor: pointer; background: var(--chip); color: var(--text); }
  #rv footer button.go { background: var(--chip-on); color: var(--chip-on-text); }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2>版本更新 · 每日新聞梗圖庫</h2>
    <div class="sub">本站僅開放審核名單內的成員瀏覽與投票</div>
    <div id="gateForm">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登入</button>
        <button class="auth-tab" data-tab="signup">註冊</button>
      </div>
      <label>Email<input type="email" id="gEmail" autocomplete="username"></label>
      <label>密碼<input type="password" id="gPwd" minlength="6" autocomplete="current-password"></label>
      <div class="err" id="gErr"></div>
      <div class="note" id="gNote"></div>
      <button class="go" id="gGo">登入</button>
    </div>
    <div id="gatePending" style="display:none">
      <div class="err" style="color:var(--pending)">你的帳號已建立，但還不在審核名單內。<br>請聯絡管理員核准後重新整理。</div>
      <button class="go" id="gLogout2">登出</button>
    </div>
  </div>
</div>

<header>
  <h1>版本更新 · 每日新聞梗圖庫<small id="stamp"></small>
    <span id="userBar" style="display:none"><button id="rvOpen">📋 批次審核</button><span id="who"></span><button id="gLogout">登出</button></span>
  </h1>
  <div class="chips" id="dates"><span class="label">日期</span></div>
  <div class="chips" id="cats"><span class="label">分類</span></div>
  <div class="chips" id="stats"><span class="label">狀態</span></div>
</header>
<main><div class="wall" id="wall"></div><div class="empty" id="empty" hidden>沒有符合條件的卡片</div></main>

<div id="box"><div class="panel" id="panel"></div></div>

<div id="rv"><div class="rv-panel">
  <header class="rv-h"><b>批次審核</b><span id="rvInfo"></span></header>
  <div class="rv-list" id="rvList"></div>
  <footer>
    <span class="cnt" id="rvCnt">已標記 0 筆</span>
    <button id="rvCancel">關閉</button>
    <button class="go" id="rvSubmit">送出判定</button>
  </footer>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL = "https://ypkhjcbanfizysdnayee.supabase.co";
var SB_KEY = "sb_publishable_ZqEDonY9EZvB55YVQzI9vQ_nQPIRDCB";
var sb = supabase.createClient(SB_URL, SB_KEY);

var DATA = [], VOTES = {}, F = { date: "全部", cat: "全部", stat: "全部" };
var STAT_LABEL = { approved: "已核准", rejected: "已退件", pending: "待審核" };
var SESSION = null, MY_EMAIL = "", BOOTED = false;

/* ---------- 登入牆 ---------- */
var gateTab = "login";
document.querySelectorAll(".auth-tab").forEach(function (t) {
  t.onclick = function () {
    gateTab = t.dataset.tab;
    document.querySelectorAll(".auth-tab").forEach(function (x) { x.classList.toggle("on", false); x.classList.toggle("active", x === t); });
    document.getElementById("gGo").textContent = gateTab === "signup" ? "註冊" : "登入";
    document.getElementById("gPwd").setAttribute("autocomplete", gateTab === "signup" ? "new-password" : "current-password");
  };
});
document.getElementById("gGo").onclick = function () {
  var email = document.getElementById("gEmail").value.trim();
  var pwd = document.getElementById("gPwd").value;
  var err = document.getElementById("gErr"), note = document.getElementById("gNote");
  err.textContent = ""; note.textContent = "";
  if (!email || pwd.length < 6) { err.textContent = "請輸入 email 與至少 6 碼密碼"; return; }
  if (gateTab === "signup") {
    sb.auth.signUp({ email: email, password: pwd }).then(function (r) {
      if (r.error) { err.textContent = r.error.message; return; }
      note.textContent = "註冊成功！請至 " + email + " 收信確認後回來登入。";
    });
  } else {
    sb.auth.signInWithPassword({ email: email, password: pwd }).then(function (r) {
      if (r.error) { err.textContent = r.error.message; return; }
    });
  }
};
function doLogout() { sb.auth.signOut(); }
document.getElementById("gLogout").onclick = doLogout;
document.getElementById("gLogout2").onclick = doLogout;

function showGate(mode) {
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("gateForm").style.display = mode === "login" ? "" : "none";
  document.getElementById("gatePending").style.display = mode === "pending" ? "" : "none";
  document.getElementById("userBar").style.display = "none";
}
function hideGate() {
  document.getElementById("gate").classList.add("hidden");
  var ub = document.getElementById("userBar");
  ub.style.display = "";
  document.getElementById("who").textContent = MY_EMAIL;
}

function refreshGate() {
  if (!SESSION) { showGate("login"); return; }
  MY_EMAIL = (SESSION.user && SESSION.user.email) || "";
  sb.from("gallery_profiles").select("approved").eq("user_id", SESSION.user.id)
    .maybeSingle().then(function (r) {
      if (r.data && r.data.approved) { hideGate(); boot(); }
      else { showGate("pending"); }
    });
}
sb.auth.getSession().then(function (s) {
  SESSION = s.data.session; refreshGate();
});
sb.auth.onAuthStateChange(function (_e, sess) { SESSION = sess; refreshGate(); });

/* ---------- 投票（Supabase，具名、一人一卡一票） ---------- */
function loadVotes() {
  return sb.from("gallery_votes").select("batch,card,verdict,email").then(function (r) {
    VOTES = {};
    (r.data || []).forEach(function (v) {
      var id = v.batch + ":" + v.card;
      if (!VOTES[id]) VOTES[id] = { ok: 0, no: 0, me: null };
      VOTES[id][v.verdict] += 1;
      if (v.email === MY_EMAIL) VOTES[id].me = v.verdict;
    });
  });
}
function vote(c, verdict) {
  var reason = "";
  if (verdict === "no") reason = prompt("不行的原因？（可留空）") || "";
  sb.from("gallery_votes").upsert({
    batch: c.batch, card: c.id, user_id: SESSION.user.id, email: MY_EMAIL,
    verdict: verdict, reason: reason,
  }, { onConflict: "batch,card,user_id" }).then(function (r) {
    if (r.error) { alert("投票失敗：" + r.error.message); return; }
    loadVotes().then(render);
  });
}

/* ---------- 批次審核 ---------- */
var RV = {};   // "batch:id" -> {verdict: "ok"|"no"|null, reason: ""}

function passes(c) {
  if (F.date !== "全部" && c.date !== F.date) return false;
  if (F.cat !== "全部" && c.category !== F.cat) return false;
  if (F.stat !== "全部" && STAT_LABEL[c.status] !== F.stat) return false;
  return true;
}

function rvCount() {
  var n = 0;
  Object.keys(RV).forEach(function (k) { if (RV[k].verdict) n++; });
  document.getElementById("rvCnt").textContent = "已標記 " + n + " 筆";
  return n;
}

function openReview() {
  RV = {};
  // 對象 = 目前篩選條件下、我還沒投過票的卡
  var todo = DATA.filter(function (c) {
    var v = VOTES[c.batch + ":" + c.id];
    return passes(c) && !(v && v.me);
  });
  document.getElementById("rvInfo").textContent =
    todo.length ? "共 " + todo.length + " 張未投票（依目前篩選）" : "目前篩選下沒有未投票的卡";
  var list = document.getElementById("rvList");
  list.innerHTML = "";
  todo.forEach(function (c) {
    var key = c.batch + ":" + c.id;
    RV[key] = { verdict: null, reason: "" };
    var row = document.createElement("div");
    row.className = "rv-row";
    row.innerHTML =
      '<img src="' + c.img + '" alt="">' +
      '<div><div class="t">' + c.topic +
      ' <small>' + c.id + " · " + c.category + " · " + c.date + "</small></div>" +
      '<div class="rv-c">' +
      '<button class="ok">👍 可以</button>' +
      '<button class="no">👎 不行</button>' +
      '<input placeholder="問題出在哪?(👎時建議填,會進學習規則)" maxlength="120">' +
      "</div></div>";
    var bOk = row.querySelector(".ok"), bNo = row.querySelector(".no"),
        inp = row.querySelector("input");
    row.querySelector("img").onclick = function () { open(c); };
    bOk.onclick = function () {
      RV[key].verdict = RV[key].verdict === "ok" ? null : "ok";
      bOk.classList.toggle("sel-ok", RV[key].verdict === "ok");
      bNo.classList.remove("sel-no");
      if (RV[key].verdict === "ok") RV[key].verdict = "ok";
      rvCount();
    };
    bNo.onclick = function () {
      RV[key].verdict = RV[key].verdict === "no" ? null : "no";
      bNo.classList.toggle("sel-no", RV[key].verdict === "no");
      bOk.classList.remove("sel-ok");
      rvCount();
    };
    inp.oninput = function () { RV[key].reason = inp.value.trim(); };
    list.appendChild(row);
  });
  rvCount();
  document.getElementById("rv").classList.add("show");
}

function submitReview() {
  var rows = [];
  Object.keys(RV).forEach(function (k) {
    if (!RV[k].verdict) return;   // 沒標記的 = 略過
    var parts = k.split(":");
    rows.push({
      batch: parts[0], card: parts[1],
      user_id: SESSION.user.id, email: MY_EMAIL,
      verdict: RV[k].verdict, reason: RV[k].reason || "",
    });
  });
  if (!rows.length) { alert("還沒有標記任何一張"); return; }
  sb.from("gallery_votes").upsert(rows, { onConflict: "batch,card,user_id" })
    .then(function (r) {
      if (r.error) { alert("送出失敗：" + r.error.message); return; }
      document.getElementById("rv").classList.remove("show");
      loadVotes().then(render);
      alert("已送出 " + rows.length + " 筆判定");
    });
}
document.getElementById("rvOpen").onclick = openReview;
document.getElementById("rvCancel").onclick = function () {
  document.getElementById("rv").classList.remove("show");
};
document.getElementById("rvSubmit").onclick = submitReview;

/* ---------- 圖庫 ---------- */
function chips(elId, values, key) {
  var el = document.getElementById(elId);
  el.querySelectorAll(".chip").forEach(function (c) { c.remove(); });
  values.forEach(function (v) {
    var b = document.createElement("button");
    b.className = "chip" + (F[key] === v ? " on" : "");
    b.textContent = v;
    b.onclick = function () {
      F[key] = v;
      el.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("on"); });
      b.classList.add("on");
      render();
    };
    el.appendChild(b);
  });
}

function render() {
  var wall = document.getElementById("wall");
  wall.innerHTML = "";
  var shown = 0;
  DATA.forEach(function (c) {
    if (!passes(c)) return;
    shown++;
    var d = document.createElement("div");
    d.className = "pin";
    var key = c.batch + ":" + c.id;
    var v = VOTES[key] || { ok: 0, no: 0, me: null };
    d.innerHTML =
      '<img loading="lazy" src="' + c.img + '" alt="">' +
      '<div class="meta"><div class="topic">' + c.topic + "</div>" +
      '<div class="sub"><span class="badge ' + c.status + '">' + STAT_LABEL[c.status] + "</span>" +
      '<span class="cat">' + c.category + "</span><span>" + c.date + "</span></div>" +
      '<div class="vote">' +
      '<button class="up' + (v.me === "ok" ? " my" : "") + '">👍 ' + v.ok + "</button>" +
      '<button class="down' + (v.me === "no" ? " my" : "") + '">👎 ' + v.no + "</button>" +
      '<span class="n">' + (v.me ? "你投了" : "") + "</span></div></div>";
    d.querySelector(".up").onclick = function (e) { e.stopPropagation(); vote(c, "ok"); };
    d.querySelector(".down").onclick = function (e) { e.stopPropagation(); vote(c, "no"); };
    d.onclick = function () { open(c); };
    wall.appendChild(d);
  });
  document.getElementById("empty").hidden = shown > 0;
}

function open(c) {
  document.getElementById("panel").innerHTML =
    '<img src="' + c.img + '"><div class="info">' +
    "<h2>" + c.topic + "</h2>" +
    "<pre>" + (c.lines || []).join("\n") + "</pre>" +
    '<div class="row">' + c.category + " · " + c.date + " · " + c.id + "</div>" +
    (c.source ? '<div class="row"><a href="' + c.source + '" target="_blank" rel="noopener">新聞來源 ↗</a></div>' : "") +
    "</div>";
  document.getElementById("box").classList.add("show");
}
document.getElementById("box").onclick = function (e) {
  if (e.target.id === "box") this.classList.remove("show");
};
addEventListener("keydown", function (e) {
  if (e.key === "Escape") document.getElementById("box").classList.remove("show");
});

function boot() {
  if (BOOTED) { loadVotes().then(render); return; }
  BOOTED = true;
  Promise.all([
    fetch("data.json").then(function (r) { return r.json(); }),
    loadVotes(),
  ]).then(function (rs) {
    var j = rs[0];
    DATA = j.cards || [];
    var dates = ["全部"], cats = ["全部"], stats = ["全部"];
    DATA.forEach(function (c) {
      if (dates.indexOf(c.date) < 0) dates.push(c.date);
      if (cats.indexOf(c.category) < 0) cats.push(c.category);
      var s = STAT_LABEL[c.status];
      if (stats.indexOf(s) < 0) stats.push(s);
    });
    chips("dates", dates, "date");
    chips("cats", cats, "cat");
    chips("stats", stats, "stat");
    document.getElementById("stamp").textContent =
      "更新：" + new Date(j.generated_at * 1000).toLocaleString("zh-TW");
    render();
  });
}
</script>
</body>
</html>
